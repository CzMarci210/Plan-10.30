function openEvent(id=null){edit=id;form.reset();const e=events.find(e=>e.id===id);$('dialogTitle').textContent=t(e?'edit':'new');$('deleteBtn').hidden=!e;$('formError').textContent='';form.elements.all_day.checked=e?!!e.all_day:true;dateTypes();if(e){for(const k of ['title','series','status','venue','country','description'])form.elements[k].value=e[k];for(const k of ['start_utc','end_utc'])form.elements[k].value=e.all_day?e[k].slice(0,10):localInput(e[k])}else{form.elements.start_utc.value=localDay(new Date());form.elements.end_utc.value=localDay(new Date())}$('sourceLine').textContent='';if(e?.source&&/^https:\/\//.test(e.source)){const a=document.createElement('a');a.href=e.source;a.target='_blank';a.rel='noopener noreferrer';a.className='source';a.textContent=t('source')+' · '+(e.source_date||'');$('sourceLine').append(a)}dialog.showModal()}
form.elements.all_day.onchange=dateTypes;
form.onsubmit=ev=>{ev.preventDefault();try{const all=form.elements.all_day.checked,existing=events.find(e=>e.id===edit),data={...existing,id:edit??Math.max(0,...events.map(e=>e.id))+1,all_day:all,is_demo:0};for(const k of ['title','series','status','venue','country','description'])data[k]=form.elements[k].value.trim();data.start_utc=all?form.elements.start_utc.value+'T00:00:00.000Z':new Date(form.elements.start_utc.value).toISOString();data.end_utc=all?form.elements.end_utc.value+'T23:59:59.000Z':new Date(form.elements.end_utc.value).toISOString();validate(data);if(existing){delete data.source;delete data.source_date}persist(edit===null?[...events,data]:events.map(e=>e.id===edit?data:e));dialog.close();render()}catch(e){$('formError').textContent=e.message}};
$('deleteBtn').onclick=()=>{if(edit===null||!confirm(t('deleteConfirm')))return;try{persist(events.filter(e=>e.id!==edit));dialog.close();render()}catch(e){$('formError').textContent=e.message}};
function download(content,name,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('backupBtn').onclick=()=>download(JSON.stringify({version:2,events},null,2),'GRIDLINE-backup.json','application/json');$('restoreBtn').onclick=()=>$('restoreInput').click();$('restoreInput').onchange=async ev=>{try{const file=ev.target.files[0];if(!file)return;if(file.size>5000000)throw Error(t('invalid'));const data=JSON.parse(await file.text());if(![1,2].includes(data.version))throw Error(t('invalid'));validateRows(data.events);if(!confirm(t('restoreConfirm')))return;persist(data.events);render()}catch(e){alert(e.message)}finally{ev.target.value=''}};
function makeICS(){const dt=s=>s.replace(/[-:]/g,'').replace(/\.\d{3}/,'');const escapeICS=s=>String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GRIDLINE Offline//EN','CALSCALE:GREGORIAN'];events.filter(e=>e.status!=='cancelled').forEach(e=>{lines.push('BEGIN:VEVENT','UID:'+e.id+'@gridline.offline','DTSTAMP:'+dt(new Date().toISOString()));if(e.all_day){const end=new Date(e.end_utc.slice(0,10)+'T00:00:00Z');end.setUTCDate(end.getUTCDate()+1);lines.push('DTSTART;VALUE=DATE:'+e.start_utc.slice(0,10).replace(/-/g,''),'DTEND;VALUE=DATE:'+end.toISOString().slice(0,10).replace(/-/g,''))}else lines.push('DTSTART:'+dt(e.start_utc),'DTEND:'+dt(e.end_utc));lines.push('SUMMARY:'+escapeICS(e.series+' - '+e.title),'LOCATION:'+escapeICS(e.venue+', '+e.country),'DESCRIPTION:'+escapeICS(e.description));if(e.source)lines.push('URL:'+e.source);lines.push('END:VEVENT')});lines.push('END:VCALENDAR','');return lines.map(line=>{let result='',bytes=0;for(const c of line){const n=new TextEncoder().encode(c).length;if(bytes+n>75){result+='\r\n ';bytes=1}result+=c;bytes+=n}return result}).join('\r\n')}
$('exportBtn').onclick=()=>download(makeICS(),'GRIDLINE.ics','text/calendar;charset=utf-8');
$('newBtn').onclick=()=>openEvent();$('closeDialog').onclick=$('cancelBtn').onclick=()=>dialog.close();$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};$('todayBtn').onclick=()=>{month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()};$('navCalendar').onclick=()=>{view='calendar';render()};$('navList').onclick=()=>{view='list';render()};$('search').oninput=e=>{query=e.target.value;render()};$('language').onchange=e=>{lang=e.target.value;try{localStorage.setItem('gridline.language',lang)}catch{}translate()};$('seriesSelect').innerHTML=Object.keys(colors).map(s=>`<option>${s}</option>`).join('');function standingsTable(rows,label){return `<div class="table-scroll"><table><caption>${esc(label)}</caption><thead><tr><th scope="col">#</th><th scope="col">${t('competitor')}</th><th scope="col">${t('points')}</th><th scope="col">${t('gap')}</th></tr></thead><tbody>${rows.map(([name,pts],i)=>`<tr><td>${i+1}</td><th scope="row">${esc(name)}</th><td class="points">${new Intl.NumberFormat(lang).format(pts)}</td><td>${i===0?'—':new Intl.NumberFormat(lang).format(rows[0][1]-pts)}</td></tr>`).join('')}</tbody></table></div>`}
function renderStandings(){const selected=filter==='all'?Object.keys(STANDINGS):[filter];$('standingsContent').innerHTML=selected.map(series=>{const d=STANDINGS[series];return `<article class="standings-card"><div class="standings-head"><div><span class="eyebrow">${esc(d.season)}</span><h2 style="color:${colors[series]}">${esc(series)}</h2></div><a class="source" href="${esc(d.source)}" target="_blank" rel="noopener noreferrer">${t('dataSource')} ↗</a></div><p class="subtitle">${t('topTen')} · ${t(d.type)}</p>${standingsTable(d.rows,t(d.type))}${d.manufacturers?standingsTable(d.manufacturers,t('manufacturers')):''}${d.official?`<p><a class="source" href="${esc(d.official)}" target="_blank" rel="noopener noreferrer">${t('source')} ↗</a></p>`:''}</article>`}).join('');$('standingsView').hidden=view!=='standings';$('navStandings').classList.toggle('active',view==='standings');$('calendarToolbar').hidden=view==='standings';$('newBtn').hidden=view==='standings';}
$('navStandings').onclick=()=>{view='standings';render()};

initialize();translate();
</script></body></html>
